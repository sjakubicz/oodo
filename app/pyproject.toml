[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]~=5.5.0",
    "django~=5.2.0",
    "httpx~=0.28.0",
    "psycopg[binary]~=3.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "bridge.settings"
python_files = ["tests.py", "test_*.py"]
